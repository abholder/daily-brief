name: Build and publish Daily Brief

on:
  schedule:
    # Runs at 6am and 6pm America/Chicago. GitHub Actions resolves this to the
    # right UTC offset itself, including across the Daylight Saving Time switch,
    # so the script no longer needs its own hour-check gate.
    - cron: "0 6,18 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:
    # Lets you trigger a run manually from the Actions tab, e.g. to test changes.

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Build page
        run: python scripts/fetch_and_build.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Publish edition: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
